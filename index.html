<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberQuiz Portal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --accent: #00f5d4;
      --accent-hover: #00c4a7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ff4d6d;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #162238, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border: 1px solid rgba(0, 245, 212, 0.25);
      box-shadow: 0 0 30px rgba(0, 245, 212, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      padding: 32px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    p.subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a3652;
      background: #0d1320;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button.btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #061018;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn:active {
      transform: scale(0.99);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }

    /* Quiz Styles */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #24304a;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge {
      background: rgba(0, 245, 212, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2a3652;
      background: #0d1320;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #141f35;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: rgba(0, 230, 118, 0.15);
      color: var(--success);
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(255, 77, 109, 0.15);
      color: var(--danger);
    }

    .score-box {
      text-align: center;
      padding: 20px 0;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="container" id="login-screen">
    <h1>ADMIN PORTAL</h1>
    <p class="subtitle">Sign in to access the 20-Question Challenge</p>
    <form id="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="container hidden" id="quiz-screen">
    <div class="quiz-header">
      <span class="badge">User: qua</span>
      <span id="progress-text">Question 1 of 20</span>
      <span id="score-text">Score: 0</span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options
