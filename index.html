<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbdullaObaidAIAcademy // NEURAL AI CORE & ANTI-CHEAT SYSTEM</title>
  <style>
    :root {
      --bg: #030612;
      --bg-gradient: radial-gradient(circle at 20% 20%, #0d1b3e 0%, #040817 50%, #08041c 100%);
      --panel: rgba(8, 15, 36, 0.88);
      --panel-alt: rgba(13, 24, 54, 0.92);
      --ai-blue: #00e5ff;
      --ai-blue-dim: rgba(0, 229, 255, 0.28);
      --ai-blue-glow: rgba(0, 229, 255, 0.35);
      --ai-violet: #8b5cf6;
      --ai-violet-glow: rgba(139, 92, 246, 0.35);
      --ai-mint: #10b981;
      --danger: #ff2a55;
      --text: #e2e8f0;
      --muted: #8fa4c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Rajdhani', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Live Animated Neural Network Canvas */
    #neural-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    body.anticheat-lock {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top AI Neural HUD */
    .topbar {
      width: 100%;
      max-width: 1020px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--ai-blue-dim);
      border-left: 5px solid var(--ai-blue);
      border-right: 5px solid var(--ai-violet);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      padding: 16px 24px;
      margin-bottom: 24px;
      box-shadow: 0 0 28px var(--ai-blue-glow), inset 0 0 18px rgba(139, 92, 246, 0.12);
      flex-wrap: wrap;
      gap: 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Pulsing AI Core Orb */
    .ai-orb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 10%, var(--ai-blue) 55%, var(--ai-violet) 100%);
      box-shadow: 0 0 14px var(--ai-blue), 0 0 26px var(--ai-violet);
      animation: pulseOrb 2.2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.28); opacity: 1; }
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 1.2px;
      background: linear-gradient(90deg, var(--ai-blue), #ffffff, var(--ai-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-tag {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--ai-blue);
      display: block;
      letter-spacing: 1.8px;
      margin-top: 2px;
    }

    .partners-badge {
      margin-top: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #fff;
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.12), rgba(139, 92, 246, 0.16));
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-radius: 8px;
      padding: 5px 12px;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .partners-badge span {
      color: var(--ai-blue);
      font-weight: 700;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ai-btn {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--ai-blue);
      border-radius: 10px;
      color: var(--ai-blue);
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.22s ease;
    }

    .ai-btn:hover {
      background: linear-gradient(90deg, var(--ai-blue), #38bdf8);
      color: #030612;
      box-shadow: 0 0 20px var(--ai-blue-glow);
      transform: translateY(-2px);
    }

    .ai-btn.violet {
      border-color: var(--ai-violet);
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.14);
    }

    .ai-btn.violet:hover {
      background: linear-gradient(90deg, var(--ai-violet), #a855f7);
      color: #fff;
      box-shadow: 0 0 20px var(--ai-violet-glow);
    }

    .ai-btn.danger {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(255, 42, 85, 0.1);
    }

    .ai-btn.danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 42, 85, 0.45);
    }

    /* Main AI Neural Container */
    .ai-box {
      width: 100%;
      max-width: 1020px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--ai-blue-dim);
      border-top: 2px solid var(--ai-blue);
      border-bottom: 2px solid var(--ai-violet);
      border-radius: 16px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 229, 255, 0.15);
      padding: 30px;
    }

    .ai-header {
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      padding-bottom: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1, h2 {
      color: #fff;
      font-size: 1.38rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-shadow: 0 0 12px var(--ai-blue-glow);
    }

    h1 span, h2 span {
      color: var(--ai-blue);
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }

    /* Active Student Banner */
    .student-banner {
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.12), rgba(139, 92, 246, 0.16));
      border: 1px solid var(--ai-blue-dim);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .student-banner-info {
      color: #fff;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.5px;
    }

    .student-banner-info span {
      color: var(--ai-blue);
    }

    /* Anti-Cheat Notice & Alert Banner */
    .anticheat-notice {
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid var(--ai-violet);
      border-radius: 10px;
      color: #e9d5ff;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .anticheat-notice strong {
      color: var(--ai-blue);
    }

    .cheat-alert-box {
      background: rgba(255, 42, 85, 0.22);
      border: 1px solid var(--danger);
      border-left: 5px solid var(--danger);
      border-radius: 10px;
      color: #fff;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(255, 42, 85, 0.35);
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: block;
      color: var(--ai-blue);
      margin-bottom: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      background: rgba(3, 6, 18, 0.85);
      border: 1px solid var(--ai-blue-dim);
      border-radius: 10px;
      color: #fff;
      padding: 13px 14px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }

    .field input:focus {
      border-color: var(--ai-blue);
      box-shadow: 0 0 16px var(--ai-blue-glow);
    }

    /* Topic Grid (AI Neural Nodes) */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .topic-card {
      background: var(--panel-alt);
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-left: 4px solid var(--ai-blue);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.24s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .topic-card:hover {
      border-color: var(--ai-violet);
      border-left-color: var(--ai-violet);
      transform: translateY(-4px);
      box-shadow: 0 8px 26px var(--ai-violet-glow);
    }

    .topic-num {
      color: #c4b5fd;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .topic-title {
      color: #fff;
      font-weight: 700;
      font-size: 1.08rem;
      margin-bottom: 10px;
    }

    .topic-meta {
      color: var(--ai-blue);
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
    }

    /* Quiz HUD */
    .status-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(3, 6, 18, 0.9);
      border: 1px solid var(--ai-blue-dim);
      border-left: 4px solid var(--ai-violet);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ai-blue);
      flex-wrap: wrap;
      gap: 10px;
    }

    .q-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 22px;
      line-height: 1.55;
      padding-left: 14px;
      border-left: 3px solid var(--ai-blue);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .opt-btn {
      background: rgba(13, 24, 54, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 10px;
      color: var(--text);
      padding: 15px 18px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.18s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--ai-blue);
      background: rgba(0, 229, 255, 0.14);
      transform: translateX(5px);
    }

    .opt-btn.correct {
      border-color: var(--ai-mint);
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.28);
    }

    .opt-btn.wrong {
      border-color: var(--danger);
      background: rgba(255, 42, 85, 0.22);
      color: #fda4af;
    }

    /* Admin Table */
    .table-wrap {
      overflow-x: auto;
      margin-top: 18px;
      border: 1px solid var(--ai-blue-dim);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
