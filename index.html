<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberQuiz Portal - 40Q Edition</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --accent: #00f5d4;
      --accent-hover: #00c4a7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ff4d6d;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #162238, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border: 1px solid rgba(0, 245, 212, 0.25);
      box-shadow: 0 0 30px rgba(0, 245, 212, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      padding: 32px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    p.subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a3652;
      background: #0d1320;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button.btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #061018;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    button.btn:hover {
      background: var(--accent-hover);
    }

    button.btn:active {
      transform: scale(0.99);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #24304a;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge {
      background: rgba(0, 245, 212, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2a3652;
      background: #0d1320;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #141f35;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: rgba(0, 230, 118, 0.15);
      color: var(--success);
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(255, 77, 109, 0.15);
      color: var(--danger);
    }

    .score-box {
      text-align: center;
      padding: 20px 0;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="container" id="login-screen">
    <h1>ADMIN PORTAL</h1>
    <p class="subtitle">Sign in to access the 40-Question Challenge</p>
    <form id="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="container hidden" id="quiz-screen">
    <div class="quiz-header">
      <span class="badge">User: qua</span>
      <span id="progress-text">Question 1 of 40</span>
      <span id="score-text">Score: 0</span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <button class="btn hidden" id="next-btn">Next Question</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="container hidden" id="result-screen">
    <h1>QUIZ COMPLETE</h1>
    <div class="score-box">
      <p class="subtitle">Final Score</p>
      <div class="score-number" id="final-score">0 / 40</div>
      <p class="subtitle" id="result-message"></p>
    </div>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>

  <script>
    // ALL 40 QUESTIONS ARE STORED HERE
    const questions = [
      { q: "1. What does HTML stand for?", options: ["HyperText Markup Language", "HighText Machine Language", "Hyperlink Text Management", "Home Tool Markup Language"], answer: 0 },
      { q: "2. Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], answer: 1 },
      { q: "3. What is the chemical symbol for Gold?", options: ["Go", "Gd", "Au", "Ag"], answer: 2 },
      { q: "4. Which language is primarily used for styling web pages?", options: ["Python", "C++", "CSS", "SQL"], answer: 2 },
      { q: "5. What is 12 × 8?", options: ["84", "96", "108", "92"], answer: 1 },
      { q: "6. Who developed the theory of relativity?", options: ["Isaac Newton", "Nikola Tesla", "Albert Einstein", "Galileo Galilei"], answer: 2 },
      { q: "7. What does CPU stand for?", options: ["Central Processing Unit", "Computer Personal Unit", "Central Power Utility", "Core Processing Unit"], answer: 0 },
      { q: "8. Which ocean is the largest on Earth?", options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], answer: 3 },
      { q: "9. What is the boiling point of water at sea level?", options: ["90°C", "100°C", "110°C", "120°C"], answer: 1 },
      { q: "10. Which data structure uses LIFO (Last In, First Out)?", options: ["Queue", "Array", "Stack", "Linked List"], answer: 2 },
      { q: "11. What is the capital city of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Kyoto"], answer: 2 },
      { q: "12. How many bits are in one byte?", options: ["4", "8", "16", "32"], answer: 1 },
      { q: "13. Which gas do plants absorb from the atmosphere?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], answer: 2 },
      { q: "14. What is the square root of 144?", options: ["10", "11", "12", "14"], answer: 2 },
      { q: "15. Which protocol is used for secure web browsing?", options: ["HTTP", "FTP", "HTTPS", "SMTP"], answer: 2 },
      { q: "16. What is the hardest natural substance on Earth?", options: ["Iron", "Diamond", "Quartz", "Titanium"], answer: 1 },
      { q: "17. In JavaScript, which keyword declares a constant?", options: ["var", "let", "const", "static"], answer: 2 },
      { q: "18. How many continents are there on Earth?", options: ["5", "6", "7", "8"], answer: 2 },
      { q: "19. What does RAM stand for?", options: ["Random Access Memory", "Read Access Module", "Rapid Action Memory", "Run All Memory"], answer: 0 },
      { q: "20. Which element has the atomic number 1?", options: ["Helium", "Oxygen", "Hydrogen", "Carbon"], answer: 2 },
      { q: "21. What is the fastest land animal?", options: ["Lion", "Cheetah", "Pronghorn", "Falcon"], answer: 1 },
      { q: "22. Which planet is closest to the Sun?", options: ["Venus", "Earth", "Mercury", "Mars"], answer: 2 },
      { q: "23. What does GPU stand for?", options: ["General Processing Unit", "Graphics Processing Unit", "Global Power Unit", "Graphical Performance Utility"], answer: 1 },
      { q: "24. What is the chemical formula for water?", options: ["CO2", "H2O", "O2", "NaCl"], answer: 1 },
      { q: "25. Which country is home to the Great Barrier Reef?", options: ["Brazil", "South Africa", "Australia", "Indonesia"], answer: 2 },
      { q: "26. What is 15% of 200?", options: ["20", "25", "30", "35"], answer: 2 },
      { q: "27. Which HTML tag is used to create a hyperlink?", options: ["<link>", "<a>", "<href>", "<url>"], answer: 1 },
      { q: "28. What is the largest mammal in the world?", options: ["African Elephant", "Blue Whale", "Giraffe", "Colossal Squid"], answer: 1 },
      { q: "29. Which number system uses only 0s and 1s?", options: ["Decimal", "Hexadecimal", "Octal", "Binary"], answer: 3 },
      { q: "30. What is the capital of France?", options: ["Rome", "Madrid", "Paris", "Berlin"], answer: 2 },
      { q: "31. How many degrees are in a right angle?", options: ["45", "90", "180", "360"], answer: 1 },
      { q: "32. Which organ pumps blood throughout the human body?", options: ["Lungs", "Brain", "Heart", "Liver"], answer: 2 },
      { q: "33. What does USB stand for?", options: ["Universal Serial Bus", "United System Board", "Universal Storage Backup", "Ultra Speed Bus"], answer: 0 },
      { q: "34. Which planet has the most prominent ring system?", options: ["Jupiter", "Uranus", "Neptune", "Saturn"], answer: 3 },
      { q: "35. What is the value of Pi (π) rounded to two decimal places?", options: ["3.12", "3.14", "3.16", "3.18"], answer: 1 },
      { q: "36. Which company created the Windows operating system?", options: ["Apple", "IBM", "Microsoft", "Google"], answer: 2 },
      { q: "37. What is the longest river in the world?", options: ["Amazon", "Nile", "Yangtze", "Mississippi"], answer: 1 },
      { q: "38. Which CSS property changes the text color of an element?", options: ["font-color", "text-style", "color", "background-color"], answer: 2 },
      { q: "39. How many players are on a standard soccer (football) team on the field?", options: ["9", "10", "11", "12"], answer: 2 },
      { q: "40. What does Wi-Fi allow devices to do?", options: ["Charge wirelessly", "Connect to a network wirelessly", "Increase CPU speed", "Cool the battery"], answer: 1 }
    ];

    const loginForm = document.getElementById('login-form');
    const loginScreen = document.getElementById('login-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const loginError = document.getElementById('login-error');

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const nextBtn = document.getElementById('next-btn');

    let currentIdx = 0;
    let score = 0;

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === 'qua' && pass === '231') {
        loginError.textContent = '';
        loginScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        startQuiz();
      } else {
        loginError.textContent = 'Invalid username or password.';
      }
    });

    function startQuiz() {
      currentIdx = 0;
      score = 0;
      scoreText.textContent = `Score: ${score}`;
      loadQuestion();
    }

    function loadQuestion() {
      nextBtn.classList.add('hidden');
      const current = questions[currentIdx];
      progressText.textContent = `Question ${currentIdx + 1} of ${questions.length}`;
      questionText.textContent = current.q;
      optionsContainer.innerHTML = '';

      current.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => selectOption(idx, btn));
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIdx, selectedBtn) {
      const correctIdx = questions[currentIdx].answer;
      const allBtns = optionsContainer.querySelectorAll('.option-btn');

      allBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIdx) btn.classList.add('correct');
      });

      if (selectedIdx === correctIdx) {
        score++;
        scoreText.textContent = `Score: ${score}`;
      } else {
        selectedBtn.classList.add('wrong');
      }

      nextBtn.textContent = currentIdx === questions.length - 1 ? 'See Results' : 'Next Question';
      nextBtn.classList.remove('hidden');
    }

    nextBtn.addEventListener('click', () => {
      currentIdx++;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
      const msg = score >= 32 ? 'Awesome job!' : score >= 20 ? 'Solid effort!' : 'Keep practicing!';
      document.getElementById('result-message').textContent = msg;
    }

    document.getElementById('restart-btn').addEventListener('click', () => {
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      startQuiz();
    });
  </script>
</body>
</html>
