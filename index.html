<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbdullaObaidAIAcademy // UAE NATIONAL AI & ANTI-CHEAT SYSTEM</title>
  <style>
    :root {
      --bg: #070908;
      --bg-gradient: radial-gradient(circle at 18% 18%, #0a291a 0%, #070908 55%, #1c080a 100%);
      --panel: rgba(12, 16, 15, 0.92);
      --panel-alt: rgba(18, 25, 22, 0.95);
      --uae-green: #00732f;
      --uae-green-bright: #00b84c;
      --uae-green-glow: rgba(0, 184, 76, 0.32);
      --uae-red: #ff0000;
      --uae-red-glow: rgba(255, 0, 0, 0.32);
      --uae-gold: #d4af37;
      --uae-gold-dim: rgba(212, 175, 55, 0.35);
      --uae-white: #ffffff;
      --danger: #ff2a55;
      --text: #f3f6f4;
      --muted: #9eb0a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Rajdhani', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Geometric Mashrabiya / Heritage Grid Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(45deg, rgba(212, 175, 55, 0.04) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(212, 175, 55, 0.04) 25%, transparent 25%),
        linear-gradient(to right, rgba(0, 184, 76, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 184, 76, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: -1;
    }

    body.anticheat-lock {
      user-select: none;
      -webkit-user-select: none;
    }

    /* UAE Flag Ribbon Accent */
    .uae-flag-strip {
      width: 100%;
      max-width: 1020px;
      height: 6px;
      display: flex;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
      margin-bottom: -2px;
      z-index: 2;
    }
    .flag-red { width: 22%; background: var(--uae-red); }
    .flag-green { width: 26%; background: var(--uae-green); }
    .flag-white { width: 26%; background: var(--uae-white); }
    .flag-black { width: 26%; background: #141414; }

    /* Top UAE HUD Bar */
    .topbar {
      width: 100%;
      max-width: 1020px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--uae-gold-dim);
      border-left: 6px solid var(--uae-red);
      border-right: 6px solid var(--uae-green-bright);
      border-radius: 0 0 14px 14px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      padding: 16px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 22px var(--uae-green-glow);
      flex-wrap: wrap;
      gap: 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* UAE Emblem Crest Icon */
    .uae-crest {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--uae-red) 0%, var(--uae-gold) 50%, var(--uae-green-bright) 100%);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.65);
      flex-shrink: 0;
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 1.2px;
      background: linear-gradient(90deg, #ffffff, var(--uae-gold), var(--uae-green-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-tag {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--uae-gold);
      display: block;
      letter-spacing: 1.8px;
      margin-top: 2px;
    }

    .partners-badge {
      margin-top: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #fff;
      background: linear-gradient(90deg, rgba(255, 0, 0, 0.14), rgba(0, 115, 47, 0.22));
      border: 1px solid var(--uae-gold-dim);
      border-radius: 8px;
      padding: 5px 12px;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .partners-badge span {
      color: var(--uae-gold);
      font-weight: 700;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .uae-btn {
      background: rgba(0, 115, 47, 0.18);
      border: 1px solid var(--uae-green-bright);
      border-radius: 10px;
      color: #6ee7b7;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.22s ease;
    }

    .uae-btn:hover {
      background: var(--uae-green);
      color: #ffffff;
      border-color: var(--uae-gold);
      box-shadow: 0 0 18px var(--uae-green-glow);
      transform: translateY(-2px);
    }

    .uae-btn.red {
      border-color: var(--uae-red);
      color: #ff9999;
      background: rgba(255, 0, 0, 0.14);
    }

    .uae-btn.red:hover {
      background: var(--uae-red);
      color: #fff;
      border-color: var(--uae-gold);
      box-shadow: 0 0 18px var(--uae-red-glow);
    }

    .uae-btn.gold {
      border-color: var(--uae-gold);
      color: var(--uae-gold);
      background: rgba(212, 175, 55, 0.12);
    }

    .uae-btn.gold:hover {
      background: var(--uae-gold);
      color: #070908;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.45);
    }

    /* Main UAE Container */
    .uae-box {
      width: 100%;
      max-width: 1020px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--uae-gold-dim);
      border-top: 3px solid var(--uae-green-bright);
      border-bottom: 3px solid var(--uae-red);
      border-radius: 16px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 115, 47, 0.18);
      padding: 30px;
    }

    .uae-header {
      border-bottom: 1px solid var(--uae-gold-dim);
      padding-bottom: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1, h2 {
      color: #fff;
      font-size: 1.38rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    h1 span, h2 span {
      color: var(--uae-gold);
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }

    /* Active Student Banner */
    .student-banner {
      background: linear-gradient(90deg, rgba(255, 0, 0, 0.14), rgba(0, 115, 47, 0.22));
      border: 1px solid var(--uae-gold-dim);
      border-left: 4px solid var(--uae-red);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .student-banner-info {
      color: #fff;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.5px;
    }

    .student-banner-info span {
      color: var(--uae-gold);
    }

    /* Anti-Cheat Notice & Alert Banner */
    .anticheat-notice {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.35);
      border-left: 5px solid var(--uae-red);
      border-radius: 10px;
      color: #ffe4e6;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .anticheat-notice strong {
      color: var(--uae-gold);
    }

    .cheat-alert-box {
      background: rgba(255, 0, 0, 0.24);
      border: 1px solid var(--uae-red);
      border-left: 5px solid var(--uae-red);
      border-radius: 10px;
      color: #fff;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.35);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin
